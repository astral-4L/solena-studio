services:
  - type: web
    name: solena
    runtime: node
    plan: starter
    buildCommand: npm install -g bun && bun install && NITRO_PRESET=node-server bun run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/public/health
    envVars:
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
